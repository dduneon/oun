# 오운 로컬 개발 인프라. MariaDB는 필수, Redis는 다음 단계(세션/실시간) 대비로 띄워둔다.
services:
  mariadb:
    image: mariadb:11
    container_name: oun-mariadb
    restart: unless-stopped
    # 한글(이모지 포함)을 담으려면 서버 기본 문자셋을 utf8mb4로 강제해야 한다.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: oun
      MARIADB_USER: oun
      MARIADB_PASSWORD: oun_dev_pw
      MARIADB_ROOT_PASSWORD: oun_dev_root_pw
    ports:
      - '3306:3306'
    volumes:
      - oun_mariadata:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oun-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - oun_redisdata:/data

  # 오브젝트 스토리지(운동 인증 사진 등). API :9000, 콘솔 :9001
  minio:
    image: minio/minio:latest
    container_name: oun-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oun
      MINIO_ROOT_PASSWORD: oun_dev_pw
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - oun_miniodata:/data

volumes:
  oun_mariadata:
  oun_redisdata:
  oun_miniodata:
